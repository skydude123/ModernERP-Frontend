<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Purchase Order Report</title>

    <link
      rel="stylesheet"
      href="https://kendo.cdn.telerik.com/themes/12.3.0/default/default-ocean-blue.css"
    />

    <style>
      html,
      body,
      #reportViewer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        overflow: hidden;
        background: #ffffff;
        font-family: Arial, sans-serif;
      }

      #reportViewer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .viewer-message {
        box-sizing: border-box;
        width: 100%;
        padding: 24px;
        color: #334155;
        background: #ffffff;
      }

      .viewer-message h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
      }

      .viewer-message p {
        margin: 0 0 6px;
        font-size: 14px;
        line-height: 1.5;
      }

      .viewer-message code {
        display: block;
        margin-top: 12px;
        padding: 10px;
        overflow-wrap: anywhere;
        color: #991b1b;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 5px;
      }
    </style>

    <!-- jQuery must load before Telerik Report Viewer -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>

  <body>
    <div id="reportViewer">
      <div class="viewer-message">
        <h1>Loading Purchase Order...</h1>
        <p>Please wait while the report is being prepared.</p>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        const currentHost = String(
          window.location.hostname || "",
        ).toLowerCase();

        const isLocal =
          currentHost === "localhost" || currentHost === "127.0.0.1";

        /*
         * Local Angular:
         * http://localhost:1231
         *
         * Local API:
         * http://localhost:51033
         *
         * Production API:
         * https://tpa-inv-backend.twinbeeprintads.com
         */
        const apiBaseUrl = isLocal
          ? "http://localhost:51033"
          : "https://tpa-inv-backend.twinbeeprintads.com";

        const reportingServiceUrl = apiBaseUrl + "/api/reports";

        const viewerScriptUrl =
          apiBaseUrl + "/api/reports/resources/js/telerikReportViewer";

        const queryParams = new URLSearchParams(window.location.search);

        const poNo = String(queryParams.get("poNo") || "").trim();

        function escapeHtml(value) {
          return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function showMessage(title, message, details) {
          const viewer = document.getElementById("reportViewer");

          viewer.innerHTML =
            '<div class="viewer-message">' +
            "<h1>" +
            escapeHtml(title) +
            "</h1>" +
            "<p>" +
            escapeHtml(message) +
            "</p>" +
            (details ? "<code>" + escapeHtml(details) + "</code>" : "") +
            "</div>";
        }

        function loadScript(source) {
          return new Promise(function (resolve, reject) {
            const existingScript = document.querySelector(
              'script[data-telerik-viewer="true"]',
            );

            if (existingScript) {
              existingScript.remove();
            }

            const script = document.createElement("script");

            script.src = source;
            script.type = "text/javascript";
            script.async = false;
            script.dataset.telerikViewer = "true";

            script.onload = function () {
              resolve();
            };

            script.onerror = function () {
              reject(new Error("Unable to load Telerik script: " + source));
            };

            document.head.appendChild(script);
          });
        }

        function initializeViewer() {
          if (!window.jQuery || !window.jQuery.fn) {
            showMessage(
              "jQuery failed to load.",
              "The Telerik Report Viewer requires jQuery 3.7.1.",
            );

            return;
          }

          if (typeof window.jQuery.fn.telerik_ReportViewer !== "function") {
            showMessage(
              "Telerik Report Viewer failed to initialize.",
              "The viewer JavaScript was loaded, but the Telerik plugin is unavailable.",
              viewerScriptUrl,
            );

            return;
          }

          window.jQuery("#reportViewer").empty();

          window.jQuery("#reportViewer").telerik_ReportViewer({
            serviceUrl: reportingServiceUrl,

            reportSource: {
              report: "PurchaseOrder.trdp",

              parameters: {
                po_no: poNo,
              },
            },

            viewMode: window.telerikReportViewer.ViewModes.INTERACTIVE,

            scaleMode: window.telerikReportViewer.ScaleModes.SPECIFIC,

            scale: 1.0,

            enableAccessibility: true,

            sendEmail: {
              enabled: false,
            },
          });
        }

        if (!poNo) {
          showMessage(
            "PO number is missing.",
            "No Purchase Order number was provided.",
          );

          return;
        }

        if (!window.jQuery) {
          showMessage(
            "jQuery failed to load.",
            "Verify the internet connection or host jQuery locally.",
          );

          return;
        }

        /*
         * Telerik's viewer script can automatically load/register
         * the required Kendo subset when no separate Kendo bundle
         * is loaded on this HTML page.
         */
        loadScript(viewerScriptUrl)
          .then(function () {
            initializeViewer();
          })
          .catch(function (error) {
            console.error(error);

            showMessage(
              "Telerik Report Viewer failed to load.",
              "The browser cannot access the Telerik Reporting resources.",
              viewerScriptUrl,
            );
          });
      })();
    </script>
  </body>
</html>

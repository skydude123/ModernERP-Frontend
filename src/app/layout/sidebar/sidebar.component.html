<kendo-drawer-container
  class="drawer-wrap"
  [class.drawer-collapsed]="!auth.drawerExpanded()">

  <kendo-drawer
    #drawer
    [items]="items()"
    [expanded]="auth.drawerExpanded()"
    [mode]="mode()"
    [mini]="mini()"
    position="start"
    class="app-drawer"
    [autoCollapse]="false"
    [animation]="true"
    [isItemExpanded]="isItemExpanded"
    (select)="onSelect($event)">
  </kendo-drawer>

  <kendo-drawer-content class="drawer-content-wrap">
    <ng-content />
  </kendo-drawer-content>
</kendo-drawer-container>

<section class="unauthorized-page">
  <article class="unauthorized-card">
    <div class="unauthorized-badge">403</div>
    <h1>Access Denied</h1>
    <p>
      Your account is signed in, but you are not authorized to open this module.
    </p>

    <div class="unauthorized-meta">
      <div><strong>User:</strong> {{ auth.displayName() }}</div>
      <div><strong>Department:</strong> {{ auth.department() || 'N/A' }}</div>
      <div><strong>Requested URL:</strong> {{ returnUrl() }}</div>
    </div>

    <div class="unauthorized-actions">
      <button kendoButton themeColor="primary" (click)="goBack()">Go to Dashboard</button>
      <button kendoButton fillMode="outline" (click)="logout()">Logout</button>
    </div>
  </article>
</section>

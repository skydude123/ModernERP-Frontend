<section class="dashboard-page">
  <section class="welcome-shell">
    <div class="welcome-panel">
      <div
        class="welcome-watermark"
        aria-hidden="true">

        <kendo-svgicon
          [icon]="homeIcon">
        </kendo-svgicon>
      </div>

      <div class="welcome-copy">
        <span class="eyebrow">
          {{ workspaceName() }}
        </span>

        <h1>
          Welcome, {{ userName() }}
        </h1>

        <p>
          {{ workspaceDescription() }}
        </p>

        <div class="status-row">
          @for (status of statusItems(); track status.label) {
            <div
              class="status-card"
              [class.status-card--success]="status.type === 'success'">

              <span>
                {{ status.label }}
              </span>

              <strong>
                {{ status.value }}
              </strong>
            </div>
          }
        </div>
      </div>
    </div>

    <aside class="session-panel">
      <div class="session-heading">
        <span class="session-heading-icon">
          <kendo-svgicon
            [icon]="infoIcon">
          </kendo-svgicon>
        </span>

        <div>
          <span>
            Current Session
          </span>

          <h2>
            Session Details
          </h2>
        </div>
      </div>

      <div class="session-list">
        @for (item of infoCards(); track item.label) {
          <div class="session-item">
            <span>
              {{ item.label }}
            </span>

            <strong>
              {{ item.value }}
            </strong>
          </div>
        }
      </div>
    </aside>
  </section>
</section>
